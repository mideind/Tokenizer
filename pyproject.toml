# Build system configuration (PEP 517/518)
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenizer"
version = "3.6.4"
description = "A fast, compact pure-Python tokenizer for Icelandic text with sentence segmentation"
authors = [{ name = "Miðeind ehf.", email = "mideind@mideind.is" }]
maintainers = [{ name = "Vilhjálmur Þorsteinsson", email = "vt@mideind.is" }]
readme = "README.md"
license = "MIT"
keywords = [
    "tokenizer",
    "tokenization",
    "icelandic",
    "nlp",
    "natural-language-processing",
    "text-processing",
    "sentence-segmentation",
    "parsing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Icelandic",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://mideind.is"
Repository = "https://github.com/mideind/Tokenizer"
Documentation = "https://github.com/mideind/Tokenizer#readme"
Issues = "https://github.com/mideind/Tokenizer/issues"
Changelog = "https://github.com/mideind/Tokenizer#changelog"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.0",
    "mypy>=2.0",
    "build>=1.0",
    "twine>=6.0",
]

[project.scripts]
tokenize = "tokenizer.main:main"

[dependency-groups]
test = [
    "pytest>=8.0",
]
lint = [
    "ruff>=0.15.0",
]
type = [
    "mypy>=2.0",
]
release = [
    "build>=1.0",
    "twine>=6.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "type" },
    { include-group = "release" },
    "pytest-cov>=5.0",
]

# *** Tool Configuration ***

[tool.uv]
default-groups = []

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
tokenizer = ["*.conf", "py.typed"]

# Ruff: Modern Python linter and formatter
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
extend-select = [
    "E501",  # Line too long
    "I",     # isort (import sorting)
]
ignore = [
    "F405",  # Name may be undefined, or defined from star imports
    "E731",  # Do not assign a lambda expression, use a def
]

[tool.ruff.lint.isort]
known-first-party = ["tokenizer"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"test/*.py" = [
    "E501",  # Long fixture strings are easier to audit inline
    "E741",  # Split tests intentionally use l/r for left/right tokens
]

# MyPy: Static type checker
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Pytest: Testing framework
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
